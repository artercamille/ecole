<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Partiels</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F6F3E3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F1825" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Partiels">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F3E3;--card:#FFFEF8;--ink:#2F2537;--muted:#6A5D7B;--line:#E3DDC2;--grape:#5D4A66;--sage:#749C75;--bad:#B5524A}
@media (prefers-color-scheme:dark){:root{--bg:#1F1825;--card:#2A2131;--ink:#F3EEDF;--muted:#B7A9C6;--line:#3E3348;--grape:#BCA5CB;--sage:#9CC29D;--bad:#E08C82}}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,sans-serif}
#lock{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
#lock form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 22px;text-align:center}
#lock img{width:72px;height:72px;border-radius:18px}
#lock h1{font-family:Fraunces,Georgia,serif;font-size:1.7rem;margin:14px 0 4px}
#lock p{color:var(--muted);margin:0 0 18px;font-size:.95rem}
#lock input{width:100%;box-sizing:border-box;font:inherit;font-size:1.05rem;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-align:center}
#lock button{width:100%;margin-top:12px;padding:15px;border:0;border-radius:14px;font:inherit;font-weight:700;font-size:1.05rem;background:var(--sage);color:#FFFEF8}
#lock .err{color:var(--bad);font-weight:600;min-height:1.3em;margin:10px 0 0;font-size:.9rem}
.shake{animation:sh .32s}@keyframes sh{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
</style>
</head>
<body>
<div id="lock" hidden>
  <form id="f" autocomplete="on">
    <img src="icons/icon-192.png" alt="">
    <h1>Partiels</h1>
    <p>Appli privée. Entre le mot de passe.</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Mot de passe" autofocus>
    <button type="submit">Ouvrir</button>
    <div class="err" id="err"></div>
  </form>
</div>
<script>
(async () => {
  const KK = "ecole-key";
  const raw = await fetch("app.enc", { cache: "no-cache" }).then(r => r.text()).catch(() => null);
  if (!raw) { document.body.textContent = "Connexion impossible."; return; }
  const b = Uint8Array.from(atob(raw.trim()), c => c.charCodeAt(0));
  const salt = b.slice(0, 16), iv = b.slice(16, 28), ct = b.slice(28);
  const b64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
  async function derive(pass) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 250000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }
  async function open(key) {
    const o = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct)));
    document.getElementById("lock").remove();
    const st = document.createElement("style"); st.textContent = o.css; document.head.appendChild(st);
    document.body.insertAdjacentHTML("afterbegin", o.body);
    for (const js of o.js) { const s = document.createElement("script"); s.textContent = js; document.body.appendChild(s); }
  }
  // clé mémorisée sur ce téléphone (liée au sel : un nouveau chiffrement redemande le mot de passe)
  try {
    const saved = JSON.parse(localStorage.getItem(KK) || "null");
    if (saved && saved.s === b64(salt)) {
      const key = await crypto.subtle.importKey("raw", Uint8Array.from(atob(saved.k), c => c.charCodeAt(0)), "AES-GCM", false, ["decrypt"]);
      await open(key); return;
    }
  } catch (e) {}
  const lock = document.getElementById("lock"); lock.hidden = false;
  document.getElementById("f").onsubmit = async e => {
    e.preventDefault();
    const err = document.getElementById("err"); err.textContent = "…";
    try {
      const key = await derive(document.getElementById("pw").value);
      await open(key);
      try { localStorage.setItem(KK, JSON.stringify({ s: b64(salt), k: b64(await crypto.subtle.exportKey("raw", key)) })); } catch (x) {}
    } catch (x) {
      err.textContent = "Mauvais mot de passe.";
      const f = document.getElementById("f"); f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake");
    }
  };
})();
</script>
</body>
</html>
